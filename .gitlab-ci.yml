workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"

default:
  tags:
    - home-linux
  timeout: 15m

check:
  image: oven/bun:1.4.2
  script:
    - bun install --frozen-lockfile
    - bun --bun run check

linux-update:
  image: python:3.14-slim
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git curl
    - python3 tests/test_update.py
